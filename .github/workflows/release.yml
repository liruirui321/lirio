name: Release All Platforms (macOS / Windows / Android / iOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.5.2 or v0.5.2-win-android)'
        required: true
        default: 'v0.5.2'

permissions:
  contents: write

jobs:
  macos:
    if: ${{ !endsWith(inputs.tag || '', '-win-android') && !endsWith(inputs.tag || '', '-android') }}
    runs-on: macos-latest
    env:
      VITE_LIRIO_SERVER_URL: ${{ secrets.VITE_LIRIO_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - name: Build macOS Universal App & DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VER=$(node -p "require('./package.json').version")
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npx tauri build --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            npx tauri build --target universal-apple-darwin
          fi
          mkdir -p out
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/Lirio-${VER}-macos.dmg" || true
          if [ -f target/universal-apple-darwin/release/bundle/macos/Lirio.app.tar.gz ]; then
            cp target/universal-apple-darwin/release/bundle/macos/Lirio.app.tar.gz "out/Lirio-${VER}-macos.app.tar.gz"
            cp target/universal-apple-darwin/release/bundle/macos/Lirio.app.tar.gz.sig "out/Lirio-${VER}-macos.app.tar.gz.sig"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: out/*

  windows:
    if: ${{ !endsWith(inputs.tag || '', '-android') }}
    runs-on: windows-latest
    env:
      VITE_LIRIO_SERVER_URL: ${{ secrets.VITE_LIRIO_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - name: Build Windows NSIS Setup & Updater Artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $VER = node -p "require('./package.json').version"
          $cfg = '{"bundle":{"resources":[],"createUpdaterArtifacts":true}}'
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx tauri build --bundles nsis --config $cfg
          } else {
            npx tauri build --bundles nsis --config '{"bundle":{"resources":[]}}'
          }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Write-Host "=== Built NSIS files ==="
          Get-ChildItem target/release/bundle/nsis | Format-Table Name, Length
          Get-ChildItem target/release/bundle/nsis/*setup.exe | Where-Object { $_.Name -notlike '*.sig' } | Select-Object -First 1 | Copy-Item -Destination "out/Lirio-$VER-windows-x64-setup.exe"
          Get-ChildItem target/release/bundle/nsis/*setup.exe.sig | Select-Object -First 1 | ForEach-Object {
            Copy-Item $_ "out/Lirio-$VER-windows-x64-setup.exe.sig"
          }
          Get-ChildItem target/release/bundle/nsis/*.nsis.zip | Select-Object -First 1 | ForEach-Object {
            Copy-Item $_ "out/Lirio-$VER-windows-x64.nsis.zip"
          }
          Get-ChildItem target/release/bundle/nsis/*.nsis.zip.sig | Select-Object -First 1 | ForEach-Object {
            Copy-Item $_ "out/Lirio-$VER-windows-x64.nsis.zip.sig"
          }
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: out/*

  android:
    runs-on: ubuntu-latest
    env:
      VITE_LIRIO_SERVER_URL: ${{ secrets.VITE_LIRIO_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: |
          set -euo pipefail
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(ls -d "$ANDROID_SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - name: Patch tauri.conf.json for Android & Build Signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          node -e "const fs=require('fs'),p='src-tauri/tauri.conf.json',c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle=c.bundle||{};c.bundle.resources=[];c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(p,JSON.stringify(c,null,2));"
          npx tauri android init
          npx tauri android build --apk --target aarch64
          mkdir -p out
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found built APK: $APK"
          ALIGNED="/tmp/lirio-aligned.apk"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -p -f 4 "$APK" "$ALIGNED"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/keystore.p12
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
              --ks /tmp/keystore.p12 \
              --ks-type PKCS12 \
              --ks-key-alias "${ANDROID_KEY_ALIAS:-lirio}" \
              --ks-pass env:ANDROID_KEYSTORE_PASS \
              --key-pass env:ANDROID_KEYSTORE_PASS \
              --out "out/Lirio-${VER}-android.apk" \
              "$ALIGNED"
            rm -f /tmp/keystore.p12
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "out/Lirio-${VER}-android.apk"
          else
            cp "$ALIGNED" "out/Lirio-${VER}-android.apk"
          fi
          ls -lh "out/Lirio-${VER}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: out/*

  ios:
    if: ${{ !endsWith(inputs.tag || '', '-win-android') && !endsWith(inputs.tag || '', '-android') }}
    runs-on: macos-latest
    env:
      VITE_LIRIO_SERVER_URL: ${{ secrets.VITE_LIRIO_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - name: Initialize & Build iOS Project / IPA
        run: |
          VER=$(node -p "require('./package.json').version")
          npx tauri ios init
          mkdir -p out
          if npx tauri ios build --export-method ad-hoc; then
            IPA=$(find src-tauri/gen/apple/build -name "*.ipa" | head -n 1 || true)
            if [ -n "$IPA" ]; then cp "$IPA" "out/Lirio-${VER}-ios.ipa"; fi
          else
            xcodebuild -project src-tauri/gen/apple/aboboo.xcodeproj -scheme aboboo_iOS -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build
            ditto -c -k --sequesterRsrc --keepParent src-tauri/gen/apple/build "out/Lirio-${VER}-ios-unsigned.zip" || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-ios
          path: out/*

  release:
    needs: [macos, windows, android, ios]
    if: ${{ always() && (needs.windows.result == 'success' || needs.android.result == 'success' || needs.macos.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate merged latest.json for desktop auto-updater
        run: |
          node - <<'EOF'
          const fs = require('node:fs');
          const path = require('node:path');
          const ver = require('./package.json').version;
          const baseUrl = 'https://lirio.deltae.tech/releases';
          const dir = 'release-assets';
          const manifest = { version: ver, notes: `Lirio v${ver}`, pub_date: new Date().toISOString(), platforms: {} };
          const macSig = path.join(dir, `Lirio-${ver}-macos.app.tar.gz.sig`);
          if (fs.existsSync(macSig)) {
            const sig = fs.readFileSync(macSig, 'utf8').trim();
            manifest.platforms['darwin-aarch64'] = { signature: sig, url: `${baseUrl}/Lirio-${ver}-macos.app.tar.gz` };
            manifest.platforms['darwin-x86_64'] = { signature: sig, url: `${baseUrl}/Lirio-${ver}-macos.app.tar.gz` };
          }
          const winExeSig = path.join(dir, `Lirio-${ver}-windows-x64-setup.exe.sig`);
          const winZipSig = path.join(dir, `Lirio-${ver}-windows-x64.nsis.zip.sig`);
          if (fs.existsSync(winExeSig)) {
            manifest.platforms['windows-x86_64'] = { signature: fs.readFileSync(winExeSig, 'utf8').trim(), url: `${baseUrl}/Lirio-${ver}-windows-x64-setup.exe` };
          } else if (fs.existsSync(winZipSig)) {
            manifest.platforms['windows-x86_64'] = { signature: fs.readFileSync(winZipSig, 'utf8').trim(), url: `${baseUrl}/Lirio-${ver}-windows-x64.nsis.zip` };
          }
          fs.writeFileSync(path.join(dir, 'latest.json'), JSON.stringify(manifest, null, 2));
          EOF
      - uses: softprops/action-gh-release@v2
        if: ${{ !endsWith(inputs.tag || '', '-win-android') }}
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
