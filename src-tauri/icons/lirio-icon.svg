<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sageTile" x1="14%" y1="8%" x2="86%" y2="94%">
      <stop offset="0%" stop-color="#698F73" />
      <stop offset="54%" stop-color="#4A6B53" />
      <stop offset="100%" stop-color="#35503D" />
    </linearGradient>
    <radialGradient id="sageHighlight" cx="28%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#B9D5BF" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#4A6B53" stop-opacity="0" />
    </radialGradient>
    <filter id="tileShadow" x="-12%" y="-10%" width="124%" height="128%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1A261E" flood-opacity="0.26" />
    </filter>
    <filter id="logoShadow" x="-14%" y="-14%" width="128%" height="132%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1E3023" flood-opacity="0.20" />
    </filter>
  </defs>

  <!-- macOS Big Sur+ Squircle Base -->
  <g filter="url(#tileShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sageTile)" />
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sageHighlight)" />
    <rect
      x="102"
      y="102"
      width="820"
      height="820"
      rx="184"
      fill="none"
      stroke="#FFFFFF"
      stroke-opacity="0.16"
      stroke-width="4"
    />
  </g>

  <!-- Pure Geometric Warm Sage Hamster Vector Logo -->
  <g filter="url(#logoShadow)" transform="translate(512 512) scale(1.28) translate(-512 -480)">
    <!-- Botanical Sage Leaf Crown -->
    <path
      d="M 512 384 L 512 346"
      fill="none"
      stroke="#A7CCB0"
      stroke-width="18"
      stroke-linecap="round"
    />
    <!-- Left Sage Leaf -->
    <path
      d="M 510 350 C 452 338 398 290 398 226 C 460 226 506 274 510 350 Z"
      fill="#A7CCB0"
    />
    <path
      d="M 494 334 Q 452 292 422 250"
      fill="none"
      stroke="#4A6B53"
      stroke-width="10"
      stroke-linecap="round"
    />
    <!-- Right Sage Leaf -->
    <path
      d="M 514 350 C 572 338 626 290 626 226 C 564 226 518 274 514 350 Z"
      fill="#CBE2D0"
    />
    <path
      d="M 530 334 Q 572 292 602 250"
      fill="none"
      stroke="#4A6B53"
      stroke-width="10"
      stroke-linecap="round"
    />

    <!-- Hamster Ears -->
    <circle cx="352" cy="404" r="64" fill="#FAF7F0" />
    <ellipse cx="356" cy="408" rx="33" ry="37" transform="rotate(-18 356 408)" fill="#8CB095" />
    <circle cx="672" cy="404" r="64" fill="#FAF7F0" />
    <ellipse cx="668" cy="408" rx="33" ry="37" transform="rotate(18 668 408)" fill="#8CB095" />

    <!-- Chubby Hamster Face Silhouette -->
    <path
      d="M 512 374
         C 612 374 674 414 692 474
         C 724 508 752 548 752 596
         C 752 678 656 734 512 734
         C 368 734 272 678 272 596
         C 272 548 300 508 332 474
         C 350 414 412 374 512 374 Z"
      fill="#FAF7F0"
    />

    <!-- Warm Cheek Blush -->
    <ellipse cx="362" cy="604" rx="42" ry="24" fill="#EAC4B2" opacity="0.72" />
    <ellipse cx="662" cy="604" rx="42" ry="24" fill="#EAC4B2" opacity="0.72" />

    <!-- Graphic Pill Eyes -->
    <ellipse cx="428" cy="526" rx="22" ry="28" fill="#2A4030" />
    <ellipse cx="596" cy="526" rx="22" ry="28" fill="#2A4030" />

    <!-- Minimalist Terracotta-Coral Nose -->
    <path
      d="M 488 570 C 488 558 536 558 536 570 C 536 584 522 596 512 596 C 502 596 488 584 488 570 Z"
      fill="#D98262"
    />

    <!-- Clean Graphic W-Smile -->
    <path
      d="M 470 614 Q 491 634 512 608 Q 533 634 554 614"
      fill="none"
      stroke="#2A4030"
      stroke-width="15"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
